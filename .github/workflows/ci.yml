name: Offline contracts and measured-result audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python scripts/verify_results.py
      - run: uv run python scripts/check_coverage_results.py
      - name: Recompute held-out WebJudge results
        run: |
          uv run python scripts/score_webarena.py results/webarena/trajectories.jsonl /tmp/webarena-summary.json
          cmp results/webarena/summary.json /tmp/webarena-summary.json
      - run: uv run quality-gate --help
