[project]
name = "quality-gate"
version = "0.1.0"
requires-python = ">=3.12"
description = "Independent acceptance checks for Agent artifacts and business final state, with controlled release-regression witnesses."
dependencies = ["scikit-learn>=1.6"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.26", "ruff>=0.11"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
quality-gate = "quality_gate.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
